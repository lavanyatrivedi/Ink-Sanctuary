kind = "web"
previewPath = "/"
title = "Order Tattoo"
version = "1.0.0"
id = "artifacts/order-tattoo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22744

[services.development]
run = "pnpm --filter @workspace/order-tattoo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/order-tattoo", "run", "build" ]
serve = "static"
publicDir = "artifacts/order-tattoo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22744"
BASE_PATH = "/"
